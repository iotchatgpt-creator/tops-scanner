<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TOPS Metro Tracker - Demo Print Codes</title>
    <!-- JsBarcode for Barcodes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <!-- QRCode.js for QR Codes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            padding: 40px;
            margin: 0;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 { margin: 0 0 10px 0; color: #0d9488; }
        .header p { margin: 0; color: #64748b; }
        .print-btn {
            background: #0d9488;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        .print-btn:hover { background: #0f766e; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            page-break-inside: avoid;
        }
        .card-header {
            margin-bottom: 20px;
            width: 100%;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        .card-title {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
        }
        .card-subtitle {
            font-size: 14px;
            color: #64748b;
            margin: 0;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .codes-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            align-items: center;
            gap: 40px;
        }
        svg { max-width: 100%; height: auto; }
        .code-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .code-label {
            font-size: 12px;
            font-weight: bold;
            color: #94a3b8;
            text-transform: uppercase;
        }
        
        .qr-wrapper {
            padding: 10px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        /* Print Styles */
        @media print {
            body { background: white; padding: 0; }
            .header button { display: none; }
            .card { border: 1px solid #000; box-shadow: none; break-inside: avoid; margin-bottom: 20px; }
            .grid { display: block; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>TOPS Demo Codes</h1>
        <p>Print this page or scan directly from the screen during the live demo.</p>
        <button class="print-btn" onclick="window.print()">🖨️ Print Codes</button>
    </div>

    <div class="grid" id="codes-grid">
        <!-- Cards generated by JS -->
    </div>

    <script>
        // The 3 key metros for the Demo Walkthrough
        const demoMetros = [
            { id: 'MTR-001', desc: 'Clean Available', detail: 'Use for STEP 1: Allocate' },
            { id: 'MTR-004', desc: 'In Transit', detail: 'Use for STEP 2: Receive' },
            { id: 'MTR-006', desc: 'Soiled', detail: 'Use for STEP 3: Return' },
            
            // A couple extra just in case
            { id: 'MTR-003', desc: 'Allocated', detail: 'Extra Demo Item' },
            { id: 'MTR-008', desc: 'At Plant', detail: 'Extra Demo Item' }
        ];

        const grid = document.getElementById('codes-grid');

        demoMetros.forEach((metro, index) => {
            // Create Card
            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <div class="card-header">
                    <h2 class="card-title">${metro.id}</h2>
                    <p class="card-subtitle">${metro.desc} — ${metro.detail}</p>
                </div>
                <div class="codes-container">
                    <div class="code-box">
                        <span class="code-label">Barcode</span>
                        <svg id="barcode-${index}"></svg>
                    </div>
                    <div class="code-box">
                        <span class="code-label">QR Code</span>
                        <div id="qrcode-${index}" class="qr-wrapper"></div>
                    </div>
                </div>
            `;
            
            grid.appendChild(card);

            // Generate Barcode (Code128)
            JsBarcode("#barcode-" + index, metro.id, {
                format: "CODE128",
                width: 2.5,
                height: 80,
                displayValue: true,
                fontSize: 18,
                margin: 10,
                background: "#ffffff",
                lineColor: "#000000"
            });

            // Generate QR Code
            new QRCode(document.getElementById("qrcode-" + index), {
                text: metro.id,
                width: 110,
                height: 110,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        });
    </script>
</body>
</html>
